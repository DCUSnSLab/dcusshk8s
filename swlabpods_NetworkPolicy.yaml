apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kda-test-deny-external-traffic
  namespace: kda-test
spec:
  podSelector:
    matchLabels:
      kubessh: userpods
  policyTypes:
  - Egress
  egress:
  # Controller Service 접근 허용
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kda-test
      podSelector:
        matchLabels:
          app: controller
    ports:
    - protocol: TCP
      port: 9001
  # Compute Pod 직접 TCP 연결 허용 (터미널)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kda-test
      podSelector:
        matchLabels:
          app: warm-pod-pool
    ports:
    - protocol: TCP
      port: 8081
  # 기존 외부 트래픽 규칙
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
          - 203.250.32.0/19

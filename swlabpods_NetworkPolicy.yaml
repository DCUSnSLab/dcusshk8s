apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: swlabpods-deny-external-traffic
spec:
  podSelector:
    matchLabels:
      kubessh: userpods
  policyTypes:
  - Egress
  egress:
  # Controller Service 접근 허용
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: swlabpods
      podSelector:
        matchLabels:
          app: controller
    ports:
    - protocol: TCP
      port: 9001
  # 기존 외부 트래픽 규칙
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
          - 203.250.32.0/19
